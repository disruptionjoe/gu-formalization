    strengthened without being proved. VRS-2 is the next reverse discriminator:
    test fixed, free and charged endpoint horns and kill any bulk-only quotient
    that drops live moment or Green data.
    The independent RSAP target now has an exact pointwise differential-rank
    schedule. If s=rank(dJ), r=rank(pi) and dim(M)=m, symplectic Poisson
    compatibility forces 2s<=m+r. For the minimal m=98 carrier this gives map
