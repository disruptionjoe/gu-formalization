    all three bounds, so no stronger pointwise linear obstruction is available.
    The next carrier gate is a local smooth 98-dimensional Poisson wall normal
    form with map rank 91-to-90 and target rank 84-to-82; no global RSAP exists
    yet.
    VRS-2 now kills a bulk-only physical quotient for the live nonzero selected
    branch. Free endpoint variation forces zero charge and remains a distinct
    escape, but excludes the fixture. Fixed data leaves momentum unconstrained
    and turns endpoint movers into charged boundary symmetries; the charged
    horn requires endpoint symplectic/BFV data. The exact W/mirror
    base-conormal candidates are not preserved by the rank-eight mixed gauge
    image, and neither half is isotropic for normal conormals, so no closed
    Green domain or polarization is selected. Boundaryless/zero-charge families
    remain unexhausted.
    VRS-3 now proves that, at conditional residual zero, the second-action
    Hessian owns only the real symmetric pullback D Upsilon^! Q D Upsilon.
    Honest off-shell, boundary-functional and Green-domain terms remain; the
    Hessian itself produces no complex structure, symplectic form, Hermitian
    pairing or positivity. VRS-4 establishes the exact typed descent theorem:
    moving J10 reaches ker(L_total)/closure(im K_total) only through companion
