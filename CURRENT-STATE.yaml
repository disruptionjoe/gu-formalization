  summary: >-
    The selected homogeneous distortion orbit now has an exact proper
    stabilizer-aware Koszul--Tate model: 21 stabilizer relations resolve the
    91 labelled moment-map components to 70 independent orbit directions,
    with no higher linear reducibility. The natural 70-dimensional complement
    is not a Lie algebra; its curvature spans all 21 stabilizer directions.
    This closes KT properness only on that one orbit. The actual selected-
    action endpoint is a valid orbit covector but has 30 nonzero independent
    charges and lies off the moment-map zero level. The live physics gate is
    therefore action ownership of either a zero-charge boundary/Green law or
    a compensating covariant edge momentum, followed by the curved BFV
    presentation and analytic domain.
    The full U(64,64) parent retains one exact central W/mirror-odd curvature
    leg. Its canonical first-Chern and universal fibre-character routes are
    closed. The conditional proper ten-dimensional spin-family theorem is
    exact in integral complex K-theory, including torsion, but the actual
    source object does not instantiate it: each fibre of
    Met_(1,3)(X4)->X4 is the noncompact space GL(4,R)/O(1,3), so the
    projection is nonproper, while the settled K77 vertical trace-reversed
    form has signature (6,4) and a nonelliptic Clifford symbol. The ordinary
    compact-family index route is therefore blocked before line selection,
    flux, observation or BV/BFV descent. The smallest W/mirror asymmetric
    base-boundary pair now constructs for both current action Green horns:
    each half is maximal isotropic for base conormals, while neither is
    isotropic for normal conormals. Conjugation selects neither member. The
    rank-eight mixed part of the selected ordinary-gauge image preserves
    neither, but that eight is only a tangent rank: its generators close to
    dimension 15, while the active `17+8` representatives bracket-generate all
    91 directions of `so(7,7)` and the inactive 66 are not an ideal. Full-
    gauge covariance requires either an independently action-owned split-
    stabilizer reduction or the 40-dimensional `Spin(7,7)/H_split` moving-
    polarization orbit. Source `epsilon` already owns the latter as a
    dependent projection of its full moving labelled Clifford frame, with
    zero new configuration fields. The actual selected-action endpoint
    momentum fails the necessary stabilizer-annihilation test on the frozen
    exact fixture: 15 of 51 split charges and 15 of 40 mixed charges are
    nonzero. Direct cotangent descent to the polarization orbit is therefore
    unavailable there. The larger charged edge completion and its split
    moment-map zero level must be retained. The normalized full 91-ghost
    classical BFV charge now closes exactly by moment-map equivariance and
    `so(7,7)` Jacobi. At the frozen distortion, however, the action has rank
    70 and a 21-dimensional odd-axis `so(3,4)` stabilizer; the full zero level
    is nonregular at `(T,0)`. A proper stabilizer-aware Koszul--Tate/
    ghost-for-ghost resolution and the analytic domain remain open, so no
    luminous/mirror physical selection follows.
    Weinstein's total theory remains
    explicitly non-chiral; the open physics burden is low-curvature
    luminous/dark chiral-looking decoupling through a nonstandard operator or
    owned BV/domain, not a net-chirality target. The
    separate base and normal twistor kinematics now extend to a reconstructed
    local/developable rank-four carrier and exact graph-incidence tangent
    adapter. The settled K77 branching has four complex-32 observation
    summands, not two; they sit two per complex-64 ambient Weyl half and are
    distinct from spacetime graph two-planes. Mixed 4-by-10 connection terms
    exchange each paired set. Exact Weyl controls scope the strict Lorentzian
    holomorphic horn to conformally-flat regions. The general-Lorentzian H3
    successor now advances: the observed conformal spin geometry canonically
    constructs a local-twistor connection, and the exact four-dimensional
    twistor projector embeds its carrier in ambient ker Gamma14 while remaining
    distinct from Pi14. Raw tractor square is Weyl/Cotton curvature; the
    correct untwisted curved-complex condition is Bach-flatness through the
    twistor-spinor Yang--Mills detour sequence, admitting non-conformally-flat
    Einstein controls. The full GU normal/mixed twist still requires the total
    connection to be Yang--Mills, and the third-order detour middle map is not
    directly the owned first-order rolled operator. Ledger hypothesis
    HYP-TW-COHERENCE-01 preserves this sharpened total-Yang--Mills proposal
    without promoting it: full action Bach ownership, endpoint admission,
    factorization, positive domain and pairing, physical cohomology and any
    decoherence law remain open.
