    first jet of the unreduced Euler operator. The latter retains the exact
    rank-195 symmetric-DT map with differential d_s(E_B-E_T)=A. The qualified
    candidate now constructs on one explicit parallel formal extension: all
    133,770 symmetric second-jet slots are zero, the curvature action on Phi1
    and Spencer defect vanish, and all 2,744 differentiated action plus 71,344
