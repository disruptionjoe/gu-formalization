  summary: >-
    The full U(64,64) parent retains one exact central W/mirror-odd curvature
    leg, but its canonical global first-Chern route is now closed. On the
    connected Spin(7,7)-induced full and half-spin bundles the determinant
    characters are trivial, so enlarging to the full unitary spinor-frame
    bundle does not create determinant topology and observation pullback keeps
    c1 zero. The determinant sees the scalar center through its 128th power,
    so finite mu_128 holonomy, independent twists and boundary-relative charge
    remain distinct unbuilt routes. Weinstein's total theory remains
    explicitly non-chiral; the open physics burden is low-curvature
    luminous/dark chiral-looking decoupling through a nonstandard operator or
    owned BV/domain, not a net-chirality target. The
    separate base and normal twistor kinematics and minimal moving-J
    longitudinal BRST extension now construct; the actual twistor connection,
    Penrose pushforward and positive physical state-space reconstruction do not.
    Ledger hypothesis HYP-TW-COHERENCE-01 preserves, without promoting, the
    proposal that superposition lives in positive moving-twistor/BV cohomology
    and normalized mixed curvature supplies a coherence obstruction.
