  summary: >-
    The source/action epsilon variation now formally owns the full canonical
    cotangent preboundary parent T*Spin_0(7,7): its 182-dimensional two-form is
    exactly symplectic, with rank-91 moment differential. The selected regular
    endpoint has Cartan type split rank five plus compact rank two, and the
    previously constructed 98-dimensional M_C=Spin_0(7,7) x C carrier is
    exactly the symplectic pullback of that full parent. The same construction
    works for every real Cartan chamber. Its finite generally disconnected
    union therefore gives a global 98-dimensional realization of the complete
    regular-semisimple locus and attains the regular lower bound there. It is
    an admissible restriction, not an action-selected physical subcarrier.
    Singular walls and the all-strata minimum remain open in [98,182].
    The opposite chamber M_-C cancels all 91 endpoint components and their
    first variation only as a distinct mathematical system. The one source
    epsilon carries the original endpoint sign, so duplicating it gives 2mu,
    not cancellation. The principal Cartan moment bundle admits local gauge-
    fixed sections but no full-G-equivariant charge-only section; its canonical
    connection has curvature spanning all seven Cartan directions and
    transports rather than selects the fibre ambiguity. Therefore source
    ownership of the formal full parent is closed while a second opposite
    edge owner, boundary kinetic law, proper functional BFV, domains,
    positivity and physical cohomology remain open. Charged boundary symmetry
    is the current zero-import horn.
    In the disjoint source-residual lane, two old tautological branches remain
    exact total-residual-zero candidates only at frozen-frame fixed-boundary
    grade. The repository already owned a canonical Zorro/DeWitt connection-
    metric reconstruction that the preceding native gate did not reuse. Its
    pure-vertical geometry ports exactly to K77: the metric-trace line is a
    flat DeWitt factor and all nine labelled trace--traceless curvature planes
    vanish, while each nonzero b Phi1 branch has nonzero Clifford curvature on
    those same planes. Both branches are therefore killed as backgrounds for
    that canonical reconstruction before first-jet grade. The source Zorro
    chain remains a sketch without a coordinate formula or uniqueness theorem,
    so no source-global background no-go follows and SR-2 stays blocked. The
    corrected SR-1C target holds canonical B_Z dependent. An exact real
    source-varpi one-jet gives T=F_varpi=Upsilon_B=0 at every point without a
    Shiab inverse or external datum, so B_Z curvature is not a pointwise
    obstruction. Curvature reappears as Alt(DT)=-F_BZ. The actual selected
    comm/symi/symi Hodge--Shiab map is now proved to be a 1274-by-1274 signed-
    permutation isomorphism. On the canonical Levi-Civita curvature module,
    its inverse of the forced target obeys differential Bianchi and has an
    explicit symmetric Spencer second-varpi-jet right inverse, with zero
    residual, Bianchi and holonomicity defects. Thus the first prolongation is
    admitted for the printed residual complex. The selected noncyclic
    transgression action has a different translation Euler covector. On the
    pure antisymmetric jet it has 14 live grade-one cells. More strongly, an
    exact 14-row left-cokernel certificate excludes every one of the 9,555
    symmetric grade-two DT corrections before Bianchi is imposed. Thus the
    canonical T=F_varpi=0 residual-first family is killed as a stationary
    first-action two-jet. This is reconstruction and branch scoped. Two exact
    nonzero-T homogeneous branches already solve the known local source-
    variable bulk equations, so constructing an arbitrary nonzero-T branch is
    not the live gate. Both use B=b Phi1 and are nonzero on all nine mixed
    trace-curvature planes; hence neither intersects the canonical Zorro/
    DeWitt connection, which vanishes on all nine. A genuinely new canonical-
    B_Z branch now passes the next local gate. With T=t Phi1 and a residual-
    compatible grade-two DT, the true action quotient is
    28392t^2+91t-351. It has two real nonzero roots. The symmetric-DT action
    map has rank 195 in 196 rows, so its cokernel is one-dimensional with a
    14-cell certificate support. At either root the same explicit rational
    13-cell correction kills all 196 action and 5,096 Bianchi rows exactly.
    This is a canonical-Zorro local formal action/Bianchi jet, not a complete
    stationary background. Its direct action density -t(27+728t^2) is nonzero
    at both roots. The witness is only a field one-jet: two exact extensions
    with the same one-jet give different D_B-adjoint(E_B-E_T) values, and two
    moving graph returns can preserve or cancel the direct density partial.
    Thus primitive epsilon requires at least a compatible field two-jet, while
    total fixed-varpi metric stationarity requires the selected moving Shiab/
    Hodge/frame/volume derivative bank. The exact owner audit now sharpens the
    first stop: GU does not serialize j1(E_B-E_T) on this algebraic branch in
    the common 196-row basis or the six fixed-varpi metric derivative slots.
    This missing common-basis evaluator is named O_SR1C. Exact planted
    completions change both downstream rows while preserving every admitted
    field-one-jet datum, so the absent operator cannot be replaced by zero.
    Neither branch is killed. SR-1 remains background-missing and SR-2 remains
    blocked.
    The ten rank-128 leaks are already the full N* tensor S observation-kernel
    module; the selected graph, not the carrier, remains only compact-natural.
    The bare selected action's endpoint potential now decides the boundary-law
    horn. Free endpoint variation forces p_0=p_2=0, hence zero moment map and
    zero coadjoint invariants; it excludes rather than explains the exact
    nonzero regular fixture. Fixed endpoint data leaves momentum and all seven
    invariant values unlocked, with unrestricted endpoint transformations
    retained as boundary symmetry. A nonzero locking Robin/generated graph
    requires an added boundary functional that neither source nor selected
    action owns and must satisfy seven independent invariant-tangency
    equations. The regular Lie--Poisson carrier has dimension 91, rank 84 and
    corank seven, so any local symplectic realization spanning an open charge
    neighborhood has dimension at least 98. The sharp local split model has
    dimension 84+14=98; the exact Cartan-slice construction now globalizes
    that minimum over every regular Cartan chamber as a finite disconnected
    atlas. For a Poisson submersion J:M->so(7,7)*, the pointwise radical bound
    is dim(M)>=182-rank(pi). At the zero coadjoint orbit the rank is zero, so
    every all-charge Poisson submersion has dimension at least 182. The full
    cotangent parent attains that bound. Hence the all-charge submersion
    minimum is exactly 182. The weaker RSAP target is now typed as one smooth
    surjective Poisson map submersive on the regular locus and allowed to lose
    rank on singular strata. It inherits the sharp lower bound 98 but is not
    constructed: the existing regular atlas omits singular charges. Its first
    gate is a smooth symplectic Poisson attachment across one codimension-one
    discriminant wall.
    The endpoint's seven independent type-D7 coadjoint invariants all have
    exact nonzero first derivative along the action-owned off-shell line
    (B,T)->lambda(B,T). Their common kernel is the 84-dimensional Kirillov
    tangent, so one fixed coadjoint orbit cannot carry the unconstrained
    nearby endpoint family. A boundary/Green law could still lock all seven
    values; absent that law, the successor must span multiple coadjoint values
    or retain charged boundary symmetry. No physical cohomology follows.
    The selected homogeneous distortion orbit now has an exact proper
    stabilizer-aware Koszul--Tate model: 21 stabilizer relations resolve the
    91 labelled moment-map components to 70 independent orbit directions,
    with no higher linear reducibility. The natural 70-dimensional complement
    is not a Lie algebra; its curvature spans all 21 stabilizer directions.
    This closes KT properness only on that one orbit. The actual selected-
    action endpoint is a valid orbit covector but has 30 nonzero independent
    charges and lies off the moment-map zero level. The present source owns
    the same-sign formal cotangent parent but not an opposite compensator, and
    the charge-only equivariant-selector class is closed. The live physics
    gate has reranked to a native action-stationary background and its curved
    BV/BFV presentation and analytic domain; an edge completion reopens only
    with a new second owner or opposite boundary term.
    The full U(64,64) parent retains one exact central W/mirror-odd curvature
    leg. Its canonical first-Chern and universal fibre-character routes are
    closed. The conditional proper ten-dimensional spin-family theorem is
    exact in integral complex K-theory, including torsion, but the actual
    source object does not instantiate it: each fibre of
    Met_(1,3)(X4)->X4 is the noncompact space GL(4,R)/O(1,3), so the
    projection is nonproper, while the settled K77 vertical trace-reversed
    form has signature (6,4) and a nonelliptic Clifford symbol. The ordinary
    compact-family index route is therefore blocked before line selection,
    flux, observation or BV/BFV descent. The smallest W/mirror asymmetric
    base-boundary pair now constructs for both current action Green horns:
    each half is maximal isotropic for base conormals, while neither is
    isotropic for normal conormals. Conjugation selects neither member. The
    rank-eight mixed part of the selected ordinary-gauge image preserves
    neither, but that eight is only a tangent rank: its generators close to
    dimension 15, while the active `17+8` representatives bracket-generate all
    91 directions of `so(7,7)` and the inactive 66 are not an ideal. Full-
    gauge covariance requires either an independently action-owned split-
    stabilizer reduction or the 40-dimensional `Spin(7,7)/H_split` moving-
    polarization orbit. Source `epsilon` already owns the latter as a
    dependent projection of its full moving labelled Clifford frame, with
    zero new configuration fields. The actual selected-action endpoint
    momentum fails the necessary stabilizer-annihilation test on the frozen
    exact fixture: 15 of 51 split charges and 15 of 40 mixed charges are
    nonzero. Direct cotangent descent to the polarization orbit is therefore
    unavailable there. The larger charged edge completion and its split
    moment-map zero level must be retained. The normalized full 91-ghost
    classical BFV charge now closes exactly by moment-map equivariance and
    `so(7,7)` Jacobi. At the frozen distortion, however, the action has rank
    70 and a 21-dimensional odd-axis `so(3,4)` stabilizer; the full zero level
    is nonregular at `(T,0)`. A proper stabilizer-aware Koszul--Tate/
    ghost-for-ghost resolution and the analytic domain remain open, so no
    luminous/mirror physical selection follows.
    Weinstein's total theory remains
    explicitly non-chiral; the open physics burden is low-curvature
    luminous/dark chiral-looking decoupling through a nonstandard operator or
    owned BV/domain, not a net-chirality target. The
    separate base and normal twistor kinematics now extend to a reconstructed
    local/developable rank-four carrier and exact graph-incidence tangent
    adapter. The settled K77 branching has four complex-32 observation
    summands, not two; they sit two per complex-64 ambient Weyl half and are
    distinct from spacetime graph two-planes. Mixed 4-by-10 connection terms
    exchange each paired set. Exact Weyl controls scope the strict Lorentzian
    holomorphic horn to conformally-flat regions. The general-Lorentzian H3
    successor now advances: the observed conformal spin geometry canonically
    constructs a local-twistor connection, and the exact four-dimensional
    twistor projector embeds its carrier in ambient ker Gamma14 while remaining
    distinct from Pi14. Raw tractor square is Weyl/Cotton curvature; the
    correct untwisted curved-complex condition is Bach-flatness through the
    twistor-spinor Yang--Mills detour sequence, admitting non-conformally-flat
    Einstein controls. The universal K77-typed adapted-connection algebra at
    the actual 4-plus-10 dimensions now has exact Gauss, Codazzi and Ricci
    curvature blocks and tangent, normal and mixed Yang--Mills current blocks.
    Exact controls reject total-Yang--Mills iff II=0 in both directions:
    nonzero symmetric II can occur in a flat
    total connection, while II=0 can retain a nonzero diagonal current.
    Horizontal reference normalization changes the full connection curvature
    by transgression. A moving reduction R measures the mixed block through
    D_A R and contributes the connection current [R,D_A R], so an on-shell
    coupled connection need not be source-free Yang--Mills and the ordinary
    detour need not close. Ledger hypothesis HYP-TW-COHERENCE-01 now preserves
    a coupled moving-reduction/detour-BV proposal without promoting it: the
    action-owned A/R pair, normalized connection, coupled complex, full action
    Bach ownership, endpoint admission, rolled-operator factorization,
    positive domain and pairing, physical cohomology and any decoherence law
    remain open.
    The twenty-lens reverse scaffold has now executed VRS-1 against all eleven
    complex-source families presently named in the repository. No current
    single object is J_phys. Fixed and direct routes are killed or retyped;
    moving associated-spinor J10 survives only inside an unconstructed
    bulk-boundary composite. Future action-admissible, moduli and nonlocal
