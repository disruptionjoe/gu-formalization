    second metric jet. Restoring dB to B-wedge-B gives exact moving-frame
    curvature covariance, and simultaneous transport of the pairing and
    noncyclic Shiab-like coefficient reproduces the co-moving scalar without
    a cyclic-trace assumption. The principal Green current is frame-covariant;
    Cartan improvements change its presymplectic representative only by a
    spacetime-exact term, not necessarily by a boundary-trivial term. K126
    subsequently vindicates that covariance theorem by exposing and cancelling
    a planted isolated-cell error, while completing the flat-germ
    common-transverse three-momentum polynomial. K127 subsequently refines the
    generic three-entry lower-order placeholder using a new local fixed-boundary
    stationary family; the result below shows that a closed two-field block is
    not automatic.
    K126 now performs the missing actual-action audit. K124's metric waves
    are back-to-back and its radial leg is homogeneous, so total metric
    momentum kills d(D2B_LC) on that slice and the -12 q^2 DeWitt result is
    retained as a specialization. For p=(1,0,0,0), q=(0,0,0,1) and nonzero
    null radial momentum r=(-1,0,0,-1), the isolated K77 exterior cell is -24
    and B-squared is zero, with partial noncyclic Cartan covector
    (-12,0,0,-12). An independent fixed-coordinate curvature expansion finds
    the omitted coframe/pairing/tautological transport contribution +24, so
    the complete witness is zero and K125 covariance is vindicated. On the
    common-transverse TT family the exact completion is
    C_t_h_h=-6(p^2+q^2+3r^2)<H1,H2>_DW with crossed polarizations zero; it
    reduces to K124 when r=0 and q=-p. The selected C_t_h_v packet remains
    zero in all 120 tests.
    K127 now constructs exact local fixed-boundary same-I1B curved stationary
    germs with T=0 and arbitrary Ricci-flat horizontal Weyl metric two-jet.
    The full selected K77 Shiab translation response vanishes coefficientwise.
    On the Weyl-aligned common-transverse family, the K124-normalized
    one-radial C_t_h_h lower-response compression is 24 K_perp I_2, where
    K_perp=R_1212; this is not the pure TT Hessian at T=0. Thus
    K125's generic three-entry placeholder collapses to one unselected
    curvature parameter. A second exact Ricci-flat fixture has zero compressed
    TT block but sends plus and cross into 13 and 23 metric components, proving
    that generic Weyl curvature does not preserve the selected two-field TT
    plane. Symmetric lower-order terms leave the local Green current unchanged.
    K128 now proves that I1B(g,T=0)=0 identically on the entire native
    Levi-Civita metric graph. Hence the pure metric h-h Hessian block at every
    K127 germ is exactly zero. The actual quadratic (h,t) operator has coupled
    block form [[0,A*],[A,C]], with A=D_g S(F_B) and C the distortion Hessian.
    K127's aligned 24 K_perp I_2 response is D3I1B[t,h,h], not D2I1B[h,h]
    and not a T=0 graviton pencil. A formal effective metric expression
    -A* C^{-1} A requires an owned inverse, kernel/gauge quotient, boundary
    adjoint and common closed domain. If C is singular, its kernel rows are
    constraints and multiplier directions rather than coefficients that may
    be filled by a pseudoinverse. Source-global background legality, the
    coefficientwise A,C packet, global domain, BFV and positive
    cohomology/superposition now route to K129.
