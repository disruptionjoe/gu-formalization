    DeWitt/Killing quartics are -4,+4 and the actual selected-Shiab fixed-natural
    I2B quartics are -16,+16. Since Q_B=c Q_trace/Hodge with c nonzero, either
    sign of c leaves one negative quartic ray. I1B is at most cubic and cannot
    repair the large-amplitude runaway. Thus the carrier seam is closed but the
    complete released fixed-natural bosonic route is killed at boundedness.
    SR-1F must construct an action-owned moving fundamental symmetry or
    field-dependent Q_B, a dynamically closed source/BV constraint, or a new
    higher-even stabilising action term before selecting a critical orbit and
    canonical first jet. VRS-6 still cannot instantiate.
