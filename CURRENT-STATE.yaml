    degree-at-most-three polynomial identities. Thus D_B-adjoint p and the
    already-zero moving-Shiab term close all 91 primitive-epsilon components
    on both roots. The moving metric queue now composes intrinsically rather
    than as six independent owners. Exact all-ten naturality fuses Hodge,
    pairing, Shiab and frame motion; lowerer and observation are postvariation
    equation transports; and the fixed-varpi action covector is
    rho L1+(D_g B_Z)^!(E_B-E_T). The graph-adjoint term vanishes with the
    proved j1p=0. The remaining normalized metric row is the rank-one trace
    (33703t/468-3/52)(1,0,0,0,-1,0,0,-1,0,-1), whose coefficient is coprime
    to the branch polynomial. It is nonzero on both roots. The residual-square
    second action has zero first variation at printed-residual zero, so it
    cannot cancel the trace. Both compatible parallel extensions are therefore
    killed at total fixed-varpi metric stationarity. Primitive epsilon remains
    zero on them, but no stationary background is promoted. The VRS-5 rerank
    now qualifies the strongest already-owned trace sector. The exact scalar-
    jet closure remains a genuine no-new-field/no-new-coefficient cancellation,
    but its total B curvature is C/32448 and is nonzero on all nine mixed trace
    planes where canonical F_BZ is zero. The tensors are not proportional: C
    has 91 cells, F_BZ has 107 coefficients on 25 form legs and their supports
