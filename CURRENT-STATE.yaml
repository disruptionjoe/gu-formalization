  summary: >-
    The full U(64,64) parent has one canonical central U(1) line that is odd
    under the exact anti-linear W/mirror exchange. Its curvature is the first
    gauge-invariant candidate bosonic leg, but every local real exchange-
    invariant action is even in that curvature and cannot select its sign.
    A global determinant-line flux or boundary charge may distinguish sectors,
    but neither is constructed or selected. Equal ordinary four-dimensional
    conjugate indices are compatible with Weinstein's non-chiral total theory;
    they do not construct its claimed low-curvature luminous/dark decoupling.
    Adjacent fixed-J10 work shows eight mixed ordinary-gauge directions obstruct
    fixed polarization, while moving J is covariant but not yet physical. The
    separate base and normal twistor kinematics and minimal moving-J
    longitudinal BRST extension now construct; the actual twistor connection,
    Penrose pushforward and positive physical state-space reconstruction do not.
