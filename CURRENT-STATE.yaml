    root-dependent r=3/364-t/1872, while the old r=1/129792 cancels neither
    root. Thus the scalar branch remains high-conviction as a distinct
    canonical-realization hypothesis but does not reopen SR-1C. The first next
    swing is SR-1D: compute the constrained image/cokernel of nonparallel
    second jets into primitive epsilon and the fixed-varpi metric graph before
    attempting another large solve. That image gate is now exact. For every
    direction and arbitrary second-jet correction h, the same rank-195 block
    gives j1E_T=A h, j1E_B=2A h and j1(E_B-E_T)=A h. Differentiated
    translation compatibility imposes A h=0, so the complete momentum jet and
    fixed-varpi metric graph vanish throughout the compatible second-jet
    fibre. Bianchi and Ricci/Spencer only shrink the domain. Primitive epsilon
    therefore remains zero, while the nonzero rank-one density trace survives
    on both roots. Both fixed canonical SR-1C point/one-jets are killed across
    all compatible second jets. SR-1E must now construct or exhaust a genuinely
    distinct canonical point/first-jet branch. The remaining affine first-jet
    ambiguity is now also exhausted. The exact action/Bianchi solution is
    Q=Q0+ker(S), with rank(S)=4290 and dim ker(S)=5265. Every directionwise
    first-jet shift is Clifford-even while the Euler receiver is odd; selected
    Shiab flips parity and Hodge preserves it. All 249704 direct and 249704
    Hodge carrier-to-receiver coefficients vanish, so the affine shift changes
    neither j1E_T nor j1E_B. Composed with SR-1D, both roots are killed across
    the complete compatible affine first/two-jet fibre. A new point carrier is
    required. The newly established source
    Mexican-hat instability is an exact branch generator but does not yet
    instantiate that object. Its mass form acts on 450 constant modes in
    10 x so(6,4), whereas the selected K77 point value lies in the
    1274-dimensional Omega1(Y14,so(7,7)) carrier before first jets. The
    observation H/N splitting now supplies the exact missing interface: a
    rank-450 inclusion with image N* tensor Lambda2(N), verified on all 20250
    infinitesimal so(6,4) intertwiner cells. The map is observation-relative,
