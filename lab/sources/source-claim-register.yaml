  schema_version: '1.0'
  created: '2026-08-11'
  ratified: Joe direct chat 2026-08-11 (kills name their target claim; register is the single claim-truth
    surface)
  editions:
    draft-2021: April 1 2021 Authors Working Draft v1.0, sha256:3f28d742234a9841fc8e51ff172053200aa3eddf3ece38154a3328b9ebd186d4
    spoken: dated in-repo transcripts (toe-2025, ucsd-seminar-2025, portal-2020, iceberg-curt expositor,
      keating-record)
  rules:
  - Claim rows are edition-pinned and stable; weakening an ASSERTS row requires a new source edition or
    an adjudication artifact, never silent reinterpretation (council Seat 6).
  - Adherence blocks are dated and revision-pinned; they may go stale without invalidating claim rows
    (council Seat 9/11).
  - core partitions claims hard-core / auxiliary / disavowed-by-source; kills adjudicate against this
    partition (council Seat 1).
  - 'Enforcement: process_gates/kill_target_claim_audit.py; escape hatch NONE-NOT-A-KILL is counted every
    run.'
  - 'Verdict doctrine (ratified 2026-08-12): a critique aimed at an unclaimed target FAILS as a
    critique regardless of internal validity; two-component verdict form, failure first — read
    explorations/claim-indexed-verdict-doctrine-2026-08-12.md before any Nguyen/chirality/generations verdict.'
  - 'Relay rule (v1.1, ratified Joe direct chat 2026-08-12): any statement about a registered claim,
    in any summary, relay, or return text, carries its SC- IDs inline and preserves the source
    sentence polarity verbatim; frame regression under compression is the measured failure mode.'
  - 'Baseline at filing: 5 of the last 40 conditional-build artifacts carried kill-language; 0 named a
    target claim.'
  adjudication_headline: 'ADHERED 106 / PARTIAL 4 / UNTYPED 1 / IGNORED 0 / CONTRADICTED 0; core: hard-core
    49 / auxiliary 51 / disavowed-by-source 11 (2026-08-27 source-structure adherence wave; four structural
    source assertions carried at exact reconstruction ceilings, no global reduction, physical count map,
    higher-sector persistence or universal metric-emergence theorem proven)'
