  - {id: SC-PRE-52, role: stable 144-coupled prediction and recombination claim, row_sha256: 5f3503941ee7ac6c93bd60088ddb320e4b7590e5bda1a7d2881e1a6068734bef}

branch_declarations:
  action_architecture:
    allowed: [first_order_I1B, second_order_I2B, combined_euler_alternatives]
    unresolved: >-
      The packet does not select a complete coefficient-level fermion action,
      background, contraction, real form, domain, or normalization.
  family_semantics:
    required: two_plus_one_not_three_identical_copies
    unresolved: >-
      Representation locations and the 144 prediction do not supply an action
      covector on the family copies or identify an observed physical quotient.
  owner_coordinates:
    variables: [d54, d210]
    unresolved: >-
      The packet does not select either quadratic owner or a relation between
      their independent coefficients.

source_silent_slots:
  - family_covector
  - d54_value
  - d210_value
  - d54_to_d210_relation
  - coefficient_normalization
  - real_or_krein_coefficient_relation
  - action_owned_internal_45_projection
  - action_owned_form_leg_contraction
  - physical_observation_quotient

constraint_models:
  strict_source:
    variables: [d54_first, d54_second, d210_first, d210_second]
    equations: []
    evidence: >-
      None of the selected source rows contains a scalar equation on these
      four coefficient slots.
  source_plus_representation_equivariance:
    variables: [d54_first, d54_second, d210_first, d210_second]
    equations:
      - {coefficients: [1, -1, 0, 0], rhs: 0, meaning: equal 54 coefficients on equivalent family copies}
      - {coefficients: [0, 0, 1, -1], rhs: 0, meaning: equal 210 coefficients on equivalent family copies}
    evidence: >-
      Repository-derived family exchange symmetry, explicitly not source
      evidence, reduces four copy slots to two independent owner coordinates.
  reconstruction_extensions:
    - id: normalized_owner_ratio
      status: declared_non_source
      adds: one owner-relation equation plus a normalization
    - id: action_owned_family_covector
      status: declared_non_source
      adds: a family covector and its action-level contraction
    - id: real_krein_closure
      status: declared_non_source
      adds: a real or Krein coefficient relation from a complete action packet

forbidden_imports:
  - repository-derived 54/210 support as if it were source evidence
  - a conventional SO(10) Higgs or Yukawa coefficient relation without a typed bridge
  - fitted masses, mixing angles, or observed family data
  - a manually selected observation projector or physical quotient
  - the unreleased two-connection complex or any merged reconstruction of it
  - any later source edition without minting a new packet version

claim_ceiling: >-
  This packet can prove source silence and rank nonuniqueness only for the
  frozen edition. It cannot prove that no later source supplies the missing
  data, construct a source action, select a family covector, fix a 54:210
  ratio, identify observed matter, or move a GU verdict.

