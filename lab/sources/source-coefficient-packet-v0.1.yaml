schema_version: "1.0"
packet_id: GU-SOURCE-COEFFICIENTS-v0.1
status: frozen_projection
created: "2026-08-31"
purpose: >-
  Freeze the coefficient-relevant public-source edition used by exact rank
  experiments. This is a projection of the ratified claim register, not a
  second source ledger and not a source action.

source_register:
  path: lab/sources/source-claim-register.yaml
  schema_version: "1.0"
  sha256: dc3ae173b4cc0eb2a0e343e3d92d5f110b8e4f6eef3e2852a1e897ab4371ade6
  projection_rule: >-
    Resolve rows by id from this exact register edition and verify each
    canonical row hash. Evidence and quotations remain owned by the register.

edition_precedence:
  - id: draft-2021
    role: primary action and fermion architecture
  - id: portal-2020
    role: earlier unhedged corroboration for the stable 144 claim
  - id: toe-2025
    role: later spoken prediction and recombination wording
  - rule: >-
      A later spoken recollection supplements but does not silently rewrite a
      pinned draft row. Conflicts or changed claims require a new packet.

