# Layer-0 fork registry
#
# COMPANION FILE, added 2026-08-08: lab/process/path-dependencies.yaml
# (rendered: lab/process/path-dependencies.md). This registry records WHAT the
# forks are. That one records WHY a given check is worth doing - the causal
# chain, and the DATED TRAPS: mistakes agents have actually made on that horn.
# They are DELIBERATELY NOT MERGED. This file answers "what are the forks"; that
# one answers "why do we check". A 2026-08-08 council found that filing path
# dependencies under Layer 0 would be a category error - semantics vs
# justification - creating a homonym inside the file meant to prevent them.
# See lab/process/councils/2026-08-08-path-dependency-integration-council.md.
# SIGNATURE-AMBIENT is covered by chain PD-SIGNATURE-PARITY.
#
# One row per discrete Layer-0 fork the program stands on: the horns, whether it
# is settled, and - when settled - HOW and by WHICH artifacts. A wave disposition
# names a row id in its `fork_assumed:` frontmatter field
# (process_gates/wave_disposition_schema_audit.py); the depth counter in
# process_gates/fork_depth_audit.py reads this file to decide which declared
# horns are still undetermined.
#
# Why this file exists: the 2026-08-04 program-efficiency council measured the
# cost of deciding a fork late. The highest-fan-out fork in the program - which
# real Clifford algebra the source actually uses - was determined at Wave K,
# AFTER waves D-J had stacked seven constructions on the other horn. Every one
# of those waves passed its own review. The defect was in the queue, and nothing
# in the process was positioned to look at the queue. This registry is the queue
# surface.
#
# This file records typing and status only. It creates no claim, no verdict, no
# grade, no priority, no lane movement and no public posture, and it is not
# evidence for any physics statement. Settlements cite the artifact that did the
# work; the artifact remains the authority.
#
# HOW TO ADD A FORK: see lab/process/wave-discipline-gates-2026-08-04.md.
# Every row needs: id, title, horns (>= 2), status, fan_out, sources. A row with
# status `settled` additionally needs settled_side, settled_how, settled_at and
# settled_by (non-empty, repo-relative paths that resolve). Ids are stable:
# rename a title freely, never an id, because dispositions cite ids.

