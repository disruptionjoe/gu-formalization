# The homonym register — one index for every same-token collision the program
# has PAID for, plus the transcription-variant spellings that make exact-substring
# censuses of the primary transcripts silently incomplete.
#
# CONSOLIDATION, NOT A RIVAL (FX-3, 2026-08-16). Homonym tracking existed on
# five surfaces before this file; this register CONSOLIDATES them into one
# machine-audited index with pointers back, and invents no new surface for
# scoped work:
#   1. lab/process/NAMES.md — the repo-level "homonym disambiguation table"
#      (2026-08-10, 9 rows). Every row is absorbed here row-for-row
#      (`names_md_row` holds the exact first table cell); the gate FAILS if
#      NAMES.md ever has a name cell without a register entry, so the two
#      surfaces cannot diverge silently. NAMES.md stays in place as the
#      human-facing table.
#   2. explorations/conditional-build/cb-b-lagrangian-terms-2026-08-05.md:182-189
#      — the cb-b Layer-0 homonym quarantine (6 rows). Scope-local and
#      AUTHORITATIVE for its cluster's wording; mirrored here as index rows.
#      cb-b is not edited.
#   3. explorations/unified-source-datum-packet-v0-2026-07-30.md:122-135 —
#      the packet's "Layer-0 register" (10 rows), the surface LA-10 calls
#      "the ledger's own Layer-0 homonym register". Scope-local and
#      authoritative for packet vocabulary; mirrored here as index rows.
#   4. Per-wave `layer0` blocks with disposition HOMONYM in wave JSONs
#      (e.g. lab/process/eric-curt-wave3b-cech-domain-quotient.json,
#      eric-curt-wave3c-y14-atlas-cauchy-domain.json). These are the SCOPED
#      INSTRUMENT — typing-before-use inside one wave — and remain the right
#      place for wave-local homonyms. Durable, cross-wave collisions graduate
#      to this register.
#   5. The `[ASR]` gloss convention in lab/sources/source-claim-register.yaml
#      (10 rows carry per-quote glosses like "[ASR] 'petit salam' = Pati-Salam").
#      That convention stays; the `transcription_variant` entries here are its
#      central table.
#   Earliest precedent: the canon torsion-pun quarantine in
#   explorations/firewall-and-two-geometries/two-geometries-and-the-adapter-2026-06-29.md.
#
# ADJACENT REGISTRIES DELIBERATELY NOT MERGED (same reasoning as the 2026-08-08
# council that split path-dependencies out of the fork registry):
#   - lab/process/layer0-fork-registry.yaml — forks are OPEN QUESTIONS, not
#     naming collisions.
#   - lab/process/correction-registry.yaml — corrections propagation; a
#     homonym-CAUSED correction (e.g. V15-2, C_fin vs C_inv) lives there and is
#     cited here as a receipt.
#   - GEOMETER-VS-PHYSICS-OBJECTS.md — a synonym crosswalk (one object, two
#     vocabularies): the reverse hazard, its own surface.
#
# ENTRY DISCIPLINE. No entry without a receipt: every entry names the incident
# and the artifact that paid for the confusion (or, for rows carried from a
# prior surface, that surface's own recorded bite). A speculative homonym list
# decays into noise; this one is grown on collision, like NAMES.md.
#
# KINDS.
#   homonym               one token, two-plus unrelated live senses.
#   near_collision        two spellings one token apart denoting different
#                         objects, read as one.
#   prefix_collision      two artifact-ID families sharing a prefix.
#   transcription_variant one object, nonstandard spelling(s) in the primary
#                         ASR transcripts; exact-substring censuses for the
#                         standard spelling silently miss the source's own
#                         statements.
#   not_a_homonym         contrary control: a token that looks like a homonym
#                         candidate and provably is not.
# A lexicographer may call some `homonym` rows polysemy (senses share an
# etymology). The register types by HAZARD — no result transfers between the
# senses — not by etymology; the operational treatment is identical.
#
# SENSING FLOOR. A few highest-cost tokens carry a `sensing` block: a warn-only
# census the gate PRINTS on every run and never fails on, because prose
# legitimately uses ambient words. Baselines are dated observations, not
# thresholds or targets.
#
# This file records typing only. It creates no claim, no verdict, no grade, no
# priority, no lane movement and no public posture, and it is not evidence for
# any physics statement. Every sense cites the artifact that owns it; the
# artifact remains the authority.
#
# Read by: process_gates/homonym_register_audit.py (schema, locus resolution,
# verbatim-quote verification, NAMES.md coverage, sensing census).
# Certificate: tests/channel-swings/joe_directed_fx3_homonym_register.py.

