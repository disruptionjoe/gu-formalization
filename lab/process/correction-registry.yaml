      Killing/Krein structure is what is source-attested and observed-quotient
      positivity is source-OPEN, not disavowed.
    signature:
      match: all_families
      token_families:
        - ["krein", "indefinite", "killing form"]
        - ["positivity", "positive-definite", "positive definite"]
        - ["do not look for", "positivity fails", "positivity is excluded",
           "positivity is ruled out", "cannot be positive", "never positive",
           "positivity is forbidden", "forbids positivity", "positivity disavowed",
           "disavows positivity", "positivity is precluded"]
      blindness: >-
        The third family is a list of DISAVOWAL PHRASINGS; English has
        unboundedly many. A file asserting the withdrawn reading as "there is
        no positive-definite sector here" or "unitarity is not available"
        escapes entirely.
      known_synonyms_outside_signature:
        - "'no positivity' -- MEASURED at 70 pre-date files and rejected: it fires
