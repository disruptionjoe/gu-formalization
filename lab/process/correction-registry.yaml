# =========================================================================
# canonical_source_corrections  --  ADDED 2026-08-17 by CT-5 (ct-hardening).
#
# A SECOND, INDEPENDENT top-level key.  It is deliberately NOT part of
# `corrections:` above, because `process_gates/correction_propagation_audit.py`
# reads `data["corrections"]` and nothing else: this block is invisible to that
# gate by construction, and the identity of its before/after output is proved
# rather than hoped for (CT-5 section 5).
#
# WHY A SECOND CLASS EXISTS.  `corrections:` propagates along CITATION edges:
# "if you cite the owner, acknowledge the correction."  That mechanism cannot
# reach a document written BEFORE the correction existed, because such a
# document never cites its owner -- there is no edge to walk.  That is not a
# tuning failure, it is a reachability proof, and it is exactly the class the
# Z/3 receptacle packet (2026-08-11) fell into: it engaged a route the week's
# 2+1 sharpening later superseded, cited nothing that had been corrected, and
# no gate could see it.
#
# A `canonical_source_correction` therefore propagates along CONSUMPTION edges
# instead: it carries a `canonical_since` date and a greppable topic SIGNATURE,
# and every document DATED EARLIER whose text matches the signature is DIRTY
# for it until a check is recorded in
# `lab/process/canonical-currency-checks.yaml`.  Read by
# `process_gates/canonical_currency_audit.py`.
#
# THE CEILING, STATED ONCE HERE AND AGAIN PER ENTRY.  A signature is a
# co-occurrence test over lowercased substrings, not a parse and not a
# semantic model.  It has ONE-TOKEN BLINDNESS: a document that consumes the
# superseded reading using vocabulary outside every listed family is INVISIBLE
# to this mechanism, and a document that mentions the tokens without consuming
# the reading is a false positive.  This is the alias-table lesson: the
# instrument measures the lexicon it was given.  Each entry therefore carries
# `blindness:` (what escapes) and `known_synonyms_outside_signature:` (synonym
# families that were considered and deliberately NOT admitted, with the
# reason).  Deliberately-excluded tokens are excluded for PRECISION, and every
# one of them is a hole; they are listed so the hole is countable.
#
# SEED PROVENANCE.  All ten entries are transcribed -- not re-derived -- from
# the ten-item correction register of
# `lab/active-research/joe-directed/source-currency/`
# `scur1-source-currency-audit-2026-08-17.md` section 1, whose every item was
# byte-verified at its owner file by SCUR-1 (10/10, zero divergences).  The
# `register_item` field is that table's row number.
# =========================================================================
canonical_source_corrections:
  - id: CC-01-MET-X-ARGUMENT
    entry_class: canonical_source_correction
    register_item: 1
    canonical_since: '2026-08-15'
    owner: lab/active-research/joe-directed/base-duality/bd-c-met-x-is-an-argument-not-a-background-2026-08-15.md
    superseded_reading: >-
      That X^4 carries a canonical or background metric supplied to the theory,
      rather than MET(X^{1,3}) being the SECOND ARGUMENT of the first action --
      a canonical metric on X^4 is refused as purpose, by design.
    signature:
      match: all_families
      token_families:
        - ["met(x", "metric on x", "metric on the base", "x^4 metric", "x⁴ metric"]
        - ["background metric", "canonical metric", "fixed metric", "chosen metric",
           "given metric", "background geometry", "preferred metric"]
      blindness: >-
        A document that treats X^4's metric as ambient furniture without ever
        writing one of the seven qualifier tokens -- e.g. by saying only "the
        spacetime metric g" and using it as a background -- matches nothing and
        stays invisible.
      known_synonyms_outside_signature:
        - "'spacetime metric' / 'the metric g' -- rejected: fires on essentially every
           geometry file, so admitting it would swamp the dirty set with non-consumers"
        - "'Lorentzian metric' -- rejected for the same frequency reason"
  - id: CC-02-OBSERVED-POSITIVITY-OPEN
