        negative. This entry is the clearest demonstration that the signature
        is a co-occurrence test, not a parse.
      known_synonyms_outside_signature:
        - "'authoritative' -- MEASURED at 65 pre-date files and rejected as
           generic-prose noise"
        - "'verbatim' / 'quote' -- rejected: they are the repo's standard evidence
           vocabulary and fire nearly everywhere"
  - id: CC-11-ODD-Q-KREIN-HALF-NULLITY
