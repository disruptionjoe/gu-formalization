  - id: PD-GHOST-PARITY
    headline: >-
      "Ghost parity is blocked" is a SPECTRAL result. Turok-Bateman's parity is
      KINEMATIC and is not touched by it.
    trigger: >-
      Any work citing R3's sign-blindness, the C-operator, Bender-Mannheim, or
      concluding that the Turok-Bateman mechanism is unavailable to GU.
    naive: >-
      "R3 showed the ghost-parity mechanism fails on GU's carrier, so TB is
      dead here." R3 tested whether the SPECTRAL C is dynamics-derived. TB's
      parity comes from a two-field O(1,1) EMBEDDING and is defined where the
      spectral C is not.
    chain:
      - fact: "Bender-Mannheim's C and Turok-Bateman's ghost parity are the SAME operator on the simple-spectrum domain (||C - P_ghost|| -> 3e-8)."
        evidence: THEOREM
        receipt: explorations/big-swing-2026-07-06/BIG-SWING-CONFORMAL-CLASS-BLOCKED.md
      - fact: "They come APART at spectral degeneracies, where C exists but is NOT unique."
        evidence: THEOREM
        receipt: explorations/big-swing-2026-07-06/VG-V4-quantize-break-commuting-square.md
      - fact: "At the degenerate point the KINEMATIC parity is exactly well-defined ([P_tot, H(0)] = 0.0e+00) while the spectral C dies."
        evidence: EXACT
        receipt: explorations/big-swing-2026-07-06/VG-V4-quantize-break-commuting-square.md
      - fact: "R3's balance is caused by CHI, not by quaternionic structure: {K,chi} = 0 exactly, and the whole native algebra lies in the chirality commutant."
        evidence: EXACT
        receipt: tests/krein_parity_dichotomy_jk_anticommutation.py
      - fact: "Balance requires ANTIcommutation with K. Kramers alone gives only EVENNESS. GU's J_quat COMMUTES with the Krein Gram ([beta_S, J_quat] = 0.0e+00)."
        evidence: EXACT
        receipt: tests/krein_parity_dichotomy_jk_anticommutation.py
      - fact: "chi is the Clifford volume element and exists in every even dimension, so the chi wall is NOT horn-specific."
        evidence: EXACT
        receipt: tests/krein_parity_dichotomy_jk_anticommutation.py
    check: >-
      Before citing R3 as a blocker, ask: is the claim SPECTRAL or KINEMATIC?
      Spectral no-goes do not constrain an embedding-defined parity. Also state
      whether the arena is FIXED -- every GU test so far searched a fixed arena's
      commutant, and TB's mechanism works by enlarging it.
    traps:
      - date: 2026-08-08
        what: >-
          An agent conjectured R3's sign-blindness was a Kramers artifact of the
          (9,5) horn, and put that in a handoff prompt as a task to test. WRONG:
          Kramers gives evenness, not balance; the source is chi; and both
          inputs were already computed and filed months earlier.
        cost: "A wrong task issued to another agent; retracted the same day."
        receipt: tests/krein_parity_dichotomy_jk_anticommutation.py
      - date: 2026-08-08
        what: >-
          The {J,K} dichotomy was stated more broadly than it holds. It is a
          SPECTRAL statement and says nothing about a kinematic parity.
        cost: "Scope overreach, caught by a specialist panel the same day."
        receipt: explorations/specialist-panel-on-the-degenerate-point-2026-08-08.md
    invalidates_if: >-
      The kinematic parity is shown to require a spectral C after all; or GU's
      chirality operator is shown not to anticommute with K in the relevant arena.
    related: [PD-SIGNATURE-PARITY, PD-CONDITIONAL-VS-SETTLED]

  - id: PD-SOURCE-NOTATION
    headline: >-
      Curt Jaimungal is the EXPOSITOR; Weinstein is the AUTHOR. They use
      OPPOSITE signature notations. Never add pairs across the two.
    trigger: >-
      Any work quoting a signature pair from a transcript, or citing
      "the source" for a numeric signature claim.
    naive: >-
      "'Curt/Eric' is one source." They are two, they disagree in notation, and
      only one is authorial.
    chain:
      - fact: "Curt states raw (3,7), traceless (3,6), flipped (4,6). The repository computes (7,3), (6,3), (6,4). Exact mirrors, three for three."
        evidence: EXACT
        receipt: tests/source_signature_notation_is_mirrored.py
      - fact: "The mirror is FORCED, not inferred: all three forms are even in A = g^-1 B, so they are bit-identical at every base sign. Curt's pairs are unreachable by any base choice."
        evidence: EXACT
        receipt: tests/source_signature_notation_is_mirrored.py
      - fact: "So Curt writes (negatives, positives). His blocks (4,6)+(1,3) = (5,9) == the repository's (9,5). His ASSERTED (7,7) does not follow from them."
        evidence: EXACT
        receipt: explorations/source-signature-notation-is-mirrored-2026-08-08.md
      - fact: "The 2021 draft eq (12.19) prints TY^{7,7} = TX^{1,3} + N^{6,4}: base, fibre and total in ONE equation, one notation, summing correctly."
        evidence: AUTHOR-STATED
        receipt: lab/sources/gu-2021-draft-s11-s12-extraction-2026-08-03.md
      - fact: "Weinstein independently fixes the base at (1,3) in his own voice and gives a criterion for the trace sign (Pati-Salam Spin(6)xSpin(4))."
        evidence: AUTHOR-STATED
        receipt: lab/sources/curt-iceberg-77-primary-transcript-fetch-2026-08-08.md
    check: >-
      Declare plus-first or negatives-first before adding any signature pair.
      Attribute to EXPOSITOR or AUTHOR, never to "the source". Treat an
      expositor's guess about the author's beliefs as what it is.
    traps:
      - date: 2026-08-04
        what: "REAL-CLIFFORD-FORM's settled_how cites 'Curt/Eric's exact source-typed arithmetic' as ONE object."
        cost: "The conflation is what allowed the mixed-notation sum to survive review."
        receipt: lab/process/layer0-fork-registry.yaml
      - date: 2026-08-08
        what: >-
          An agent read Curt's "I believe Eric isn't sure which of these is the
          sector of our universe" as the AUTHOR declining to choose. It is the
          expositor's belief about the author's state of mind. Weinstein does
          choose, in his own voice, and gives a reason.
        cost: "Weighed as authorial evidence in a fork assessment."
        receipt: lab/sources/curt-iceberg-77-primary-transcript-fetch-2026-08-08.md
      - date: 2026-08-08
        what: >-
          Having found the mirror in Curt's transcript, an agent generalised to
          "there is NO source/repository convention divergence". Correct about
          Curt, WRONG about the author: both authorial surfaces say base (1,3)
          while the repository computes on (3,1).
        cost: "A resolver filed and falsified within hours."
        receipt: lab/process/layer0-fork-registry.yaml
    invalidates_if: >-
      The 2021 draft is shown to use negatives-first after all, which would make
      its (12.19) inconsistent rather than the transcript's arithmetic.
    related: [PD-SIGNATURE-PARITY]

