  - id: PD-ULTRAHYPERBOLIC-DOMAIN
    headline: >-
      Lorentzian well-posedness is not ultrahyperbolic well-posedness. For GU's
      ambient the Cauchy problem is ILL-POSED BY DEFAULT, so a domain is
      something you must SUPPLY, not something you may assume and check later.
    trigger: >-
      Any work on the operator domain, deficiency indices, formal adjoint, Green
      identity, presymplectic/covariant phase space, or that cites Baer-Ballmann,
      APS, MIT boundary conditions or "globally hyperbolic" results for the
      AMBIENT Y^14 operator.
    naive: >-
      "Boundary value problems for Dirac-type operators are standard; the domain
      exists generically and can be pinned later." That standard theory is
      uniformly about ONE TIME DIRECTION. GU's ambient (7,7)/(9,5) has many.
    chain:
      - fact: "GU's ambient operator is first-order ULTRAHYPERBOLIC on a non-compact 14-manifold -- (7,7) or (9,5), many time directions."
        evidence: EXACT
        receipt: explorations/c1-domain-moduli-result-2026-08-08.md
      - fact: "The standard Dirac boundary-value literature (Baer-Ballmann, APS, MIT, globally hyperbolic, spatially non-compact Cauchy data) is uniformly LORENTZIAN -- one time direction."
        evidence: THEOREM
        receipt: lab/sources/literature-ultrahyperbolic-wellposedness-2026-08-08.md
      - fact: "For the ultrahyperbolic equation the Cauchy problem is ILL-POSED IN GENERAL (Craig & Weinstein 2009, arXiv:0812.0210)."
        evidence: THEOREM
        receipt: lab/sources/literature-ultrahyperbolic-wellposedness-2026-08-08.md
      - fact: "A citable remedy exists and is NONLOCAL: well-posed on H^m under an explicit nonlocal constraint on the Cauchy data, on codimension-one hypersurfaces only."
        evidence: THEOREM
        receipt: lab/sources/literature-ultrahyperbolic-wellposedness-2026-08-08.md
      - fact: "The remedy does not generalise: higher-codimension initial surfaces stay ill-posed through failure of uniqueness."
        evidence: THEOREM
        receipt: lab/sources/literature-ultrahyperbolic-wellposedness-2026-08-08.md
      - fact: "C1's 346,112-dimensional admissible moduli is a SECTION-level result at filed symmetry; it does not answer the ambient deficiency-index question."
        evidence: EXACT
        receipt: explorations/c1-domain-moduli-result-2026-08-08.md
    check: >-
      State which well-posedness you are assuming and for which operator. If the
      claim is about the AMBIENT operator, "Baer-Ballmann generically" is NOT
      available -- say instead what supplies the domain, and compare it against
      the nonlocal-constraint remedy. Never let a section-level domain result
      stand in for the ambient one.
    traps:
      - date: 2026-08-08
        what: >-
          M-H10 was found to rest on "Baer-Ballmann does this generically", which
          does not cover ultrahyperbolic signature. Worse than a scope slip: the
          literature says ill-posedness is the DEFAULT there, so the premise was
          not merely unstated for this setting but pointed the wrong way. The gap
          was recorded only inside an artifact about a DIFFERENT question
          (C1's domain moduli), where no one leaning on M-H10 would meet it.
        cost: "A premise gap on a live blocker, invisible from the row that needs it, until filed as M-S5."
        receipt: lab/process/improvement-register-2026-08-03.md
    invalidates_if: >-
      A signature-appropriate well-posedness theorem covering first-order
      ultrahyperbolic operators on non-compact manifolds is found, or GU's
      ambient problem is re-typed so that it is not ultrahyperbolic.
    related: [PD-SIGNATURE-PARITY, PD-CONDITIONAL-VS-SETTLED]

