# Path dependencies: why a strange-looking check exists.
#
# PROBLEM THIS SOLVES.  layer0-fork-registry.yaml records WHAT the forks and
# homonyms are.  It does not record the CAUSAL CHAIN that makes a particular
# check worth doing, so an agent meeting "check whether this is on (9,5)" or
# "is this parity spectral or kinematic?" sees an arbitrary rule rather than a
# consequence.  Rules without their chain get skipped, or cargo-culted.
#
# SCHEMA, per chain:
#   id            stable identifier
#   headline      one line: the thing that is easy to get wrong
#   trigger       the situation an agent is in when this becomes load-bearing
#   naive         what a competent agent would reasonably assume, and why
#   chain         ordered steps. each: fact, evidence, receipt
#                 evidence: EXACT | THEOREM | AUTHOR-STATED | CONDITIONAL | OPEN
#   check         what to actually do
#   traps         mistakes ACTUALLY made, with date. not hypotheticals.
#                 this is the field that earns the file its keep.
#   invalidates_if what would break the chain
#   related       other chain ids
#
# RULE: a trap is only recorded once it has actually happened and is dated.
# Speculative pitfalls belong in the improvement register, not here.

version: 1
updated: 2026-08-14
generator: process_gates/path_dependency_audit.py

chains:

  - id: PD-SIGNATURE-PARITY
    headline: >-
      The ambient horn is not cosmetic: (9,5) forbids an odd generation count
      and (7,7) permits it. A computation on the wrong horn cannot reach three.
    trigger: >-
      Any work touching the generation count, chirality, spinor reality,
      Kramers/quaternionic structure, or that builds on a Cl(9,5) carrier.
    naive: >-
      "(9,5) vs (7,7) is a sign convention, so results transfer." They do not.
      The two are not real-isomorphic and the reality type is observable.
    chain:
      - fact: "The DeWitt fibre form is (6,4), and this is INDEPENDENT of the base sign: G(-g) = G(g) exactly."
        evidence: EXACT
        receipt: tests/signature_fork_equivariance_defect.py
      - fact: "So the base sign alone moves the ambient: (3,1)->(9,5), (1,3)->(7,7)."
        evidence: EXACT
        receipt: tests/signature_fork_equivariance_defect.py
      - fact: >-
          Weinstein's equation (12.19) authorially displays
          g*(TY^(7,7)) = TX^(1,3) + N_g^(6,4), providing a source resolver to
          the unordered {7,7} horn but not deriving the relative block sign
          from the action.
        evidence: AUTHOR-STATED
        receipt: explorations/portfolio-correction-wave-2026-08-12.md
      - fact: "Cl(9,5) = M(64,H) quaternionic; Cl(7,7) = M(128,R) real. Not real-isomorphic."
        evidence: EXACT
        receipt: tests/majorana_weyl_forces_the_seven_seven_horn.py
      - fact: "Majorana-Weyl exists iff p-q = 0 mod 8. Of the reachable horns only (7,7) qualifies."
        evidence: EXACT
        receipt: tests/majorana_weyl_forces_the_seven_seven_horn.py
      - fact: "Quaternionic structure forces Kramers doubling, hence EVEN multiplicity."
        evidence: THEOREM
        receipt: canon/no-go-quaternionic-parity-generation-sector.md
      - fact: "Three generations is ODD. So (9,5) structurally forbids the target; (7,7) permits it."
        evidence: CONDITIONAL
        receipt: explorations/twentyfive-lens-council-on-the-signature-decision-2026-08-08.md
    check: >-
      State which horn the work stands on. If Cl(9,5), say so and say whether the
      result is horn-robust. Treat equation (12.19) as a named SOURCE resolver,
      not a mathematical settlement. Do NOT let a (9,5) result silently stand
      in for the source-aligned reconstruction.
    traps:
      - date: 2026-08-04
        what: >-
          Wave K settled REAL-CLIFFORD-FORM on a MIXED-NOTATION sum: it took the
          vertical block in repository notation ((7,3)->(6,4)) and the horizontal
          in the source's ((1,3)), then added them. Read consistently in either
          notation the sum is (9,5), never (7,7).
        cost: "Four days as the program's primary reconstruction burden on a retracted derivation."
        receipt: lab/process/hostile-reviews/2026-08-08-real-clifford-form-settlement-review.md
      - date: 2026-08-08
        what: >-
          An agent wrote "Cl(3,1) = M(2,H) and Cl(1,3) = M(4,R)". SWAPPED.
          Correct: three '+' generators = M(4,R) real; one '+' = M(2,H)
          quaternionic. A sibling artifact hours earlier had it right.
        cost: "Self-contradiction inside one day; caught by re-derivation, not by review."
        receipt: tests/signature_fork_equivariance_defect.py
      - date: 2026-08-08
        what: >-
          M-H9 was named as the fork's resolver while being built on a
          COMPLEXIFIED Racah-Speiser module. Cl(p,q) (x) C depends only on p+q,
          so both horns give M(128,C) -- the module was PROVABLY incapable of
