# Recorded currency checks -- the sidecar to `canonical_source_corrections:` in
# lab/process/correction-registry.yaml.  Read by
# process_gates/canonical_currency_audit.py.
#
# WHAT A RECORD MEANS.  A document that predates a canonical correction and
# matches its signature is DIRTY until somebody looks.  A record here says
# somebody looked, and what they found.  This file is therefore the ONLY place
# where hand adjudication accumulates instead of evaporating: three days of
# SCUR-1/FIX-A reading is banked below, and a future correction re-dirties every
# document it covers, because an `ALL-REGISTER` record only clears corrections
# whose `canonical_since` is on or before the record's own date.
#
# RECORD SCHEMA
#   file           repo-relative path; must exist (gate is RED otherwise)
#   correction_id  a `canonical_source_corrections` id, or the token
#                  ALL-REGISTER, meaning "adjudicated against the whole
#                  canonical register as it stood on `date`"
#   verdict        one of
#                    CLEARED-CONSISTENT  predates the correction and does not
#                                        consume the superseded reading
#                    FENCED-COMPARATOR   consumes comparator-shaped content but
#                                        carries an explicit routing fence, so
#                                        it is scoped, not stale
#                    STALE-FOUND         genuinely consumes the superseded
#                                        reading; requires `pointer:`.  This
#                                        verdict does NOT clear: it converts
#                                        DIRTY-UNCHECKED into DIRTY-KNOWN-STALE
#                    SUPERSEDED-DOC      the document itself is retired, so its
#                                        staleness is not a live consumption risk
#   date           ISO date the check was made
#   by             the work item that made it
#   pointer        required for STALE-FOUND: where the finding is written down
#   note           free text
#
# PRECEDENCE (implemented in the gate, not inferred here)
#   1. a record scoped to the exact correction id wins over an ALL-REGISTER one
#   2. at equal scope, a clearing verdict wins over STALE-FOUND -- that is how a
#      repair (FIX-A) retires a finding (SCUR-1) without deleting the finding
#
# SEED PROVENANCE.  Everything below the `checks:` key is transcribed from
# `lab/active-research/joe-directed/source-currency/scur1-source-currency-audit-2026-08-17.md`
# (section 2's per-document verdict table, section 3's five findings, section 5's
# CB-pack table) and
# `lab/active-research/joe-directed/source-currency/fixa-cb-corrections-applied-2026-08-17.md`
# (section 2's five applied blocks).  Nothing here is a fresh adjudication by
# CT-5; CT-5 transcribed and typed, it did not re-read the corpus.
#
# SCUR-1's type key maps onto the verdict vocabulary as:
#   PREDATES-BUT-CONSISTENT -> CLEARED-CONSISTENT
#   ALREADY-CORRECTED       -> CLEARED-CONSISTENT
#   DELIBERATE-COMPARATOR   -> FENCED-COMPARATOR
#   VIOLATES-CORRECTION     -> STALE-FOUND
# SUPERSEDED-DOC is supported by the gate and is deliberately UNUSED in the seed:
# SCUR-1 typed no audited document as superseded, and inventing one to exercise
# the vocabulary would be a false record.  The verdict's machinery is exercised
# in the probe's planted cases instead.

