name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned numeric and tooling dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements.lock -r requirements-tools.lock
      - name: Record verification environment
        run: |
          python --version
          python -m pip freeze
      # Timeout 900 (not 120): tests/chase/MOVE-4/move4_spinor_square_forms.py needs
      # ~215s and tests/chase/MOVE-4/verify/indep_check.py ~585s wall on a dev Mac
      # (measured 2026-08-03, mostly single-threaded); 120s would guarantee TIMEOUTs
      # on healthy certs instead of catching regressions.
      - name: Certificate harness (quick, tracked-only)
        run: python scripts/reproduce_all.py --quick --tracked-only --timeout 900
      - name: Process gates
        run: |
          # Remaining exceptions preserve the historical 2026-08-03 baseline;
          # they have not been re-audited here. The process surface-map gate is
          # restored after current scoped validation; do not infer these other
          # exceptions are still failing or silently widen the skip list.
          skip="boundary_eta_readme_inventory_audit.py
                de_amp_diagnostic_closure_audit.py
                lab_active_research_readme_surface_map_audit.py
                lab_automation_readme_surface_map_audit.py
                lab_process_runbooks_readme_inventory_audit.py
                papers_readme_lifecycle_map_audit.py"
          rc=0
          for g in process_gates/*.py; do
            if echo "$skip" | grep -qx "[[:space:]]*$(basename "$g")"; then
              echo "SKIP (historical exception; not re-audited) $g"
              continue
            fi
            echo "== $g"
            python "$g" || rc=1
          done
          exit $rc
